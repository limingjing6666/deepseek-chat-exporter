<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DeepSeek Chat Exporter</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f6f8fc;
  --surface: #ffffff;
  --border: #e2e8f0;
  --text: #0f172a;
  --text-sub: #475569;
  --text-muted: #94a3b8;

  --brand: #4d6bfe;
  --brand-soft: rgba(77, 107, 254, 0.10);
  --brand-shadow: rgba(77, 107, 254, 0.28);

  --ok-bg: #ecfdf5;
  --ok-border: #a7f3d0;
  --ok-fg: #047857;
  --ok-dot: #10b981;

  --warn-bg: #fffbeb;
  --warn-border: #fde68a;
  --warn-fg: #b45309;
  --warn-dot: #f59e0b;

  --err-bg: #fef2f2;
  --err-border: #fecaca;
  --err-fg: #b91c1c;
  --err-dot: #ef4444;

  --muted-bg: #f1f5f9;
  --muted-border: #e2e8f0;
  --muted-fg: #64748b;
  --muted-dot: #94a3b8;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f172a;
    --surface: #1e293b;
    --border: #2e3b4e;
    --text: #f8fafc;
    --text-sub: #cbd5e1;
    --text-muted: #64748b;

    --brand: #5b7bff;
    --brand-soft: rgba(91, 123, 255, 0.16);
    --brand-shadow: rgba(59, 91, 219, 0.42);

    --ok-bg: rgba(16, 185, 129, 0.12);
    --ok-border: rgba(16, 185, 129, 0.28);
    --ok-fg: #6ee7b7;
    --ok-dot: #34d399;

    --warn-bg: rgba(245, 158, 11, 0.12);
    --warn-border: rgba(245, 158, 11, 0.28);
    --warn-fg: #fcd34d;
    --warn-dot: #fbbf24;

    --err-bg: rgba(239, 68, 68, 0.12);
    --err-border: rgba(239, 68, 68, 0.28);
    --err-fg: #fca5a5;
    --err-dot: #f87171;

    --muted-bg: #1e293b;
    --muted-border: #334155;
    --muted-fg: #94a3b8;
    --muted-dot: #64748b;
  }
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  width: 348px;
  padding: 16px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  font-size: 13px;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}

/* -- header -- */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 9px;
  min-width: 0;
}

.brand-logo {
  width: 30px;
  height: 30px;
  flex-shrink: 0;
  display: block;
  filter: drop-shadow(0 2px 5px rgba(37, 68, 224, 0.22));
}

.brand-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}

.brand h1 {
  font-size: 14px;
  font-weight: 650;
  letter-spacing: -0.25px;
  color: var(--text);
  line-height: 1.2;
}

.ver {
  font-size: 10px;
  font-weight: 500;
  color: var(--text-muted);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 1px 6px;
  line-height: 1.4;
}

.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 9px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 500;
  border: 1px solid var(--muted-border);
  background: var(--muted-bg);
  color: var(--muted-fg);
  white-space: nowrap;
  flex-shrink: 0;
  transition: background .18s, border-color .18s, color .18s;
}
.status-pill.api {
  background: var(--ok-bg);
  border-color: var(--ok-border);
  color: var(--ok-fg);
}
.status-pill.dom {
  background: var(--warn-bg);
  border-color: var(--warn-border);
  color: var(--warn-fg);
}
.status-pill.none {
  background: var(--err-bg);
  border-color: var(--err-border);
  color: var(--err-fg);
}

.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--muted-dot);
  flex-shrink: 0;
}
.status-pill.api .status-dot {
  background: var(--ok-dot);
  box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.18);
}
.status-pill.dom .status-dot {
  background: var(--warn-dot);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.18);
}
.status-pill.none .status-dot {
  background: var(--err-dot);
}

/* -- channel banner -- */
.channel {
  display: none;
  align-items: center;
  gap: 8px;
  padding: 8px 11px;
  border-radius: 10px;
  border: 1px solid transparent;
  margin-bottom: 14px;
  font-size: 11.5px;
  line-height: 1.45;
}
.channel svg {
  width: 14px;
  height: 14px;
  display: block;
  flex-shrink: 0;
}
.channel.api {
  display: flex;
  background: var(--ok-bg);
  border-color: var(--ok-border);
  color: var(--ok-fg);
}
.channel.dom {
  display: flex;
  background: var(--warn-bg);
  border-color: var(--warn-border);
  color: var(--warn-fg);
}
.channel.none {
  display: flex;
  background: var(--err-bg);
  border-color: var(--err-border);
  color: var(--err-fg);
}

/* -- primary action card -- */
.act {
  font-family: inherit;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  transition: transform .12s ease, border-color .15s ease, background-color .15s ease, box-shadow .15s ease;
}
.act:focus-visible {
  outline: 2px solid var(--brand);
  outline-offset: 2px;
}
.act:disabled {
  opacity: .48;
  cursor: not-allowed;
  transform: none !important;
  box-shadow: none !important;
}

.act-primary {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 14px;
  border-radius: 12px;
  border-color: rgba(255, 255, 255, 0.16);
  background: linear-gradient(135deg, #5b7bff 0%, #3b5bdb 100%);
  box-shadow: 0 4px 14px -2px var(--brand-shadow), inset 0 1px 0 rgba(255, 255, 255, 0.22);
  text-align: left;
}
.act-primary:hover:not(:disabled) {
  background: linear-gradient(135deg, #6483ff 0%, #4263eb 100%);
  box-shadow: 0 6px 18px -2px var(--brand-shadow), inset 0 1px 0 rgba(255, 255, 255, 0.28);
  transform: translateY(-1px);
}
.act-primary:active:not(:disabled) {
  background: linear-gradient(135deg, #4b69eb 0%, #324fc7 100%);
  transform: translateY(0) scale(0.99);
  box-shadow: 0 2px 8px -1px var(--brand-shadow);
}

.primary-icon {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.18);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  flex-shrink: 0;
}
.primary-icon svg {
  width: 20px;
  height: 20px;
}

.primary-info {
  flex: 1;
  min-width: 0;
}
.primary-top {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 3px;
}
.act-primary .label {
  font-size: 14px;
  font-weight: 600;
  color: #fff;
}
.act-primary .ext {
  font-size: 10.5px;
  font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  color: #fff;
  background: rgba(255, 255, 255, 0.20);
  padding: 1px 6px;
  border-radius: 999px;
  line-height: 1.4;
}
.act-primary .desc {
  display: block;
  font-size: 11px;
  color: rgba(255, 255, 255, 0.84);
  line-height: 1.35;
}

.primary-arrow {
  width: 17px;
  height: 17px;
  color: rgba(255, 255, 255, 0.88);
  flex-shrink: 0;
  transition: transform .15s ease;
}
.act-primary:hover:not(:disabled) .primary-arrow {
  transform: translateY(1.5px);
}

/* -- progress -- */
.progress {
  display: none;
  margin-top: 10px;
  padding: 9px 12px;
  border-radius: 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  font-size: 12px;
  color: var(--text-sub);
  align-items: center;
  gap: 8px;
}
.progress.active {
  display: flex;
}
.spinner {
  width: 14px;
  height: 14px;
  color: var(--brand);
  flex-shrink: 0;
  animation: spin .85s linear infinite;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}

/* -- result -- */
.result {
  display: none;
  margin-top: 10px;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid transparent;
  font-size: 12px;
  line-height: 1.5;
  gap: 8px;
  align-items: flex-start;
}
.result.success {
  display: flex;
  background: var(--ok-bg);
  border-color: var(--ok-border);
  color: var(--ok-fg);
}
.result.warn {
  display: flex;
  background: var(--warn-bg);
  border-color: var(--warn-border);
  color: var(--warn-fg);
}
.result.error {
  display: flex;
  background: var(--err-bg);
  border-color: var(--err-border);
  color: var(--err-fg);
}
.result-icon {
  width: 15px;
  height: 15px;
  flex-shrink: 0;
  margin-top: 2px;
}
.result-body {
  flex: 1;
  min-width: 0;
  word-break: break-word;
}
.result-line {
  display: block;
}
.result-line + .result-line {
  margin-top: 4px;
}
.result-file {
  display: inline-block;
  margin-top: 5px;
  padding: 2px 7px;
  border-radius: 5px;
  font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  font-size: 11px;
  background: rgba(15, 23, 42, 0.07);
  word-break: break-all;
}
@media (prefers-color-scheme: dark) {
  .result-file {
    background: rgba(255, 255, 255, 0.10);
  }
}

/* -- footer -- */
.foot {
  margin-top: 14px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.foot-note {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  color: var(--text-muted);
}
.foot-note svg {
  width: 12px;
  height: 12px;
}

.link-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: none;
  border: 1px solid transparent;
  padding: 4px 8px;
  font-family: inherit;
  font-size: 11px;
  color: var(--text-muted);
  cursor: pointer;
  border-radius: 6px;
  transition: color .15s, background-color .15s, border-color .15s;
}
.link-btn svg {
  width: 12px;
  height: 12px;
}
.link-btn:hover:not(:disabled) {
  color: var(--brand);
  background: var(--brand-soft);
  border-color: var(--border);
}
.link-btn:disabled {
  opacity: .4;
  cursor: not-allowed;
}
</style>
</head>
<body>

<div class="header">
  <div class="brand">
    <img class="brand-logo" src="icon128.png" alt="DeepSeek Chat Exporter">
    <div class="brand-meta">
      <h1>DeepSeek Exporter</h1>
      <span class="ver">v2.3.0</span>
    </div>
  </div>
  <div class="status-pill" id="statusPill">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">检测中...</span>
  </div>
</div>

<div class="channel" id="channelInfo">
  <span id="channelIcon" aria-hidden="true"></span>
  <span id="channelText"></span>
</div>

<button class="act act-primary" id="btnExportMd" data-format="markdown">
  <span class="primary-icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
      <polyline points="14 2 14 8 20 8"/>
      <path d="M8 13h8"/>
      <path d="M8 17h5"/>
    </svg>
  </span>
  <span class="primary-info">
    <span class="primary-top">
      <span class="label">导出 Markdown</span>
      <span class="ext">.md</span>
    </span>
    <span class="desc" id="descMd">含完整对话、思考过程与耗时</span>
  </span>
  <svg class="primary-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M12 4v12"/>
    <path d="m7 11 5 5 5-5"/>
    <path d="M5 20h14"/>
  </svg>
</button>

<div class="progress" id="progress">
  <svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
    <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
  </svg>
  <span id="progressText">正在导出 Markdown...</span>
</div>

<div class="result" id="result">
  <span class="result-icon" id="resultIcon" aria-hidden="true"></span>
  <div class="result-body" id="resultBody"></div>
</div>

<div class="foot">
  <span class="foot-note">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg>
    仅限 chat.deepseek.com
  </span>
  <button class="link-btn" id="btnDebug" title="导出 API 原始响应和解析结果，用于排查采集异常">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="m8 2 1.88 1.88"/>
      <path d="M14.12 3.88 16 2"/>
      <path d="M9 7.13v-1a3.003 3.003 0 1 1 6 0v1"/>
      <path d="M12 20c-3.3 0-6-2.7-6-6v-3a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v3c0 3.3-2.7 6-6 6"/>
      <path d="M12 20v-9"/>
      <path d="M6.53 9C4.6 8.8 3 7.1 3 5"/>
      <path d="M6 13H2"/>
      <path d="M3 21c0-2.1 1.7-3.9 3.8-4"/>
      <path d="M20.97 5c0 2.1-1.6 3.8-3.5 4"/>
      <path d="M22 13h-4"/>
      <path d="M17.2 17c2.1.1 3.8 1.9 3.8 4"/>
    </svg>
    导出原始数据
  </button>
</div>

<script src="popup.js"></script>
</body>
</html>
